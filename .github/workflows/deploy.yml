name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'src/**'
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'src/**'

permissions:
  id-token: write   # for OIDC assuming AWS role
  contents: read
  pull-requests: write

env:
  TERRAFORM_VERSION: '1.15.0'
  AWS_REGION: 'us-east-1'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check src/
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Terraform fmt
        run: terraform fmt -check -recursive terraform/

  build-lambda:
    name: Build Lambda Package
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build Lambda zip
        run: |
          cd src/processor
          pip install -r requirements.txt -t ./package
          cp handler.py ./package/
          cd package && zip -r ../lambda.zip . && cd ..
          rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: lambda-package
          path: src/processor/lambda.zip

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: build-lambda
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lambda-package
          path: src/processor/
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Terraform Init & Plan
        working-directory: terraform/environments/dev
        run: |
          terraform init
          terraform plan -out=tfplan
      - name: Comment PR with plan
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('terraform/environments/dev/tfplan', 'utf8');
            // (simplified – better to use terraform show -json and format)
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Terraform plan generated. Check workflow logs for details.`
            });

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: build-lambda
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production  # optional: require approval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lambda-package
          path: src/processor/
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Terraform Apply
        working-directory: terraform/environments/dev
        run: |
          terraform init
          terraform apply -auto-approve